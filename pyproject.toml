[tool.poetry]
name = "project-management-dashboard"
version = "0.1.0"
description = "FastAPI project management dashboard with Postgres, S3-compatible storage, and JWT authentication."
authors = ["Sandro Kvatashidze <sandrokvatashidze@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
aioboto3 = "^13.2.0"
alembic = "^1.13.3"
asyncpg = ">=0.30.0,<0.32.0"
fastapi = "^0.115.0"
bcrypt = ">=4.0.0,<4.1.0"
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
pydantic-settings = "^2.5.2"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
python-multipart = "^0.0.9"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.35" }
uvicorn = { extras = ["standard"], version = "^0.30.6" }

[tool.poetry.group.dev.dependencies]
httpx = "^0.27.2"
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.6.9"
tox = "^4.20.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: exercises the real app against Postgres + LocalStack (needs `docker compose up`); auto-skipped when unreachable",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*"]
# SQLAlchemy's async engine bridges to its sync core via greenlet, so awaited
# DB calls run inside a spawned greenlet. Starlette's sync TestClient runs the
# whole ASGI app in a background thread. Without both, coverage.py can't see
# into either and under-counts routes exercised through TestClient.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
