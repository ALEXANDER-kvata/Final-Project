[tox]
env_list = lint, test
skipsdist = true

[testenv]
# Poetry already manages an isolated venv for this project; tox here is a
# thin command runner (so CI and a local `tox -e lint`/`tox -e test` invoke
# the exact same commands), not a second layer of environment isolation.
skip_install = true
allowlist_externals = poetry
commands_pre = poetry install

[testenv:lint]
description = Ruff lint + formatting check
commands =
    poetry run ruff check .
    poetry run ruff format --check .

[testenv:test]
description = Alembic migration checkpoint + full test suite with coverage
commands =
    poetry run alembic upgrade head
    poetry run pytest --cov=app --cov-report=term-missing --cov-report=xml
